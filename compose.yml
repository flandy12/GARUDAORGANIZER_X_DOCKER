
services:
  react:
    image: node:20.20-alpine
    container_name: garudaorganizer_react
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - garuda_organizer_react_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run dev -- --host 0.0.0.0"
    restart: unless-stopped

volumes:
  react_node_modules:
