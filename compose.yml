
services:
  react:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:3000"
    volumes:
      - .:/app
      - react_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm start"
    init: true
    stdin_open: true
    tty: true

volumes:
  react_node_modules:
