server {
    listen 80;
    listen [::]:80;
    server_name garudaorganizer.com www.garudaorganizer.com;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.map$ {
        deny all;
    }
}
